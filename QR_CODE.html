<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bubbly's Heart QR</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#3a1025;color:#fff5f7;font-family:Arial,sans-serif;text-align:center;padding:20px}
.card{max-width:420px;background:#fff7f3;color:#5b1932;border-radius:28px;padding:28px;box-shadow:0 25px 80px #0008}
h1{font-family:Georgia,serif}.heart{width:260px;height:260px;margin:18px auto;display:grid;place-items:center;background:#ffdce5;clip-path:path("M130 242 C112 224 24 174 24 88 C24 30 94 14 130 66 C166 14 236 30 236 88 C236 174 148 224 130 242 Z")}
#qr{background:#fff;padding:10px;border-radius:14px}.note{font-size:12px;line-height:1.5;color:#8a4b62}
button{border:0;border-radius:999px;padding:12px 18px;background:#b8325a;color:white;font-weight:700}
</style></head><body><div class="card">
<h1>♡ Bubbly's Dreamy Birthday ♡</h1><p>Scan this heart-framed QR to open the birthday surprise.</p>
<div class="heart"><div id="qr"></div></div>
<p class="note" id="url"></p><button onclick="navigator.clipboard?.writeText(location.href)">Copy website link</button>
</div><script>
const url=location.href.replace(/QR_CODE\.html.*$/,'');
document.getElementById('url').textContent=url;
new QRCode(document.getElementById('qr'),{text:url,width:210,height:210,colorDark:'#5c1633',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.H});
</script></body></html>
